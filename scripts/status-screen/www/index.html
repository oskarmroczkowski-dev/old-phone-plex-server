<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Server Status</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #000;
    --fg: #c8ccd2;
    --muted: #80868f;
    --faint: #2a2e34;
    --ok: #3f9e66;
    --warn: #c9a227;
    --crit: #cc5540;
    --plex: #c4962c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: Roboto, "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #main {
    height: 100%; padding: 5vh 7vw 2.5vh; display: flex; flex-direction: column; justify-content: space-between;
    transition: transform 2s ease;
  }
  #main > * { flex-shrink: 0; }
  body.night #main, body.night #hint { display: none; }
  /* stars over the whole background and the rotating Earth in the middle of the screen (~4 x 4 cm on the phone) */
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  body.night #sky { display: none; }
  #globe { position: fixed; left: 50%; top: 50%; width: 214px; height: 214px; transform: translate(-50%, -50%);
    z-index: 0; pointer-events: none; transition: transform 2s ease; }
  #main { position: relative; z-index: 1; }
  .s-clock { position: relative; }
  #zodiac { display: none; }
  body.night #globe { display: none; }
  @media (orientation: portrait) { #globe { display: none; } }      /* portrait: the cards fill the whole screen */

  .clock { font-size: 22vw; font-weight: 200; line-height: .95; letter-spacing: -.02em; font-variant-numeric: tabular-nums; text-align: center; }
  .clock .hm { position: relative; display: inline-block; }
  /* seconds on the same line as the time, so the whole "17:10 44" group is centred above the date */
  .clock small { font-size: 7vw; color: var(--muted); margin-left: 1.5vw; }
  .date { font-size: 5vw; color: var(--muted); margin-top: .8vh; text-align: center; }
  .date::first-letter { text-transform: uppercase; }

  h2 { font-size: 3.2vw; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 1vh; }
  .s-wx h2 { text-align: center; }
  .s-wx .city { font-size: calc(3.2vw + 2pt); margin-bottom: .3vh; }      /* city name above the weather description */
  .s-wx .row > div:last-child { flex: 1; text-align: center; }      /* description and "feels like" centred in the free space */
  .hpa { color: #fff; font-weight: 500; }      /* pressure highlighted (useful for migraine-prone people) */
  #wxDay, #wxMore { white-space: nowrap; overflow: hidden; }
  #wxMore { text-align: center; }      /* one line; fitLine() adjusts the font size */
  .row { display: flex; align-items: center; gap: 3.5vw; }
  .wx-icon { font-size: 11vw; line-height: 1; filter: saturate(.7) brightness(.85); }
  .wx-temp { font-size: 12vw; font-weight: 200; line-height: 1; }
  .wx-desc { font-size: 4.4vw; }
  .sub { font-size: 3.7vw; color: var(--muted); line-height: 1.5; }
  .hours { display: flex; justify-content: space-between; margin-top: 1.2vh; padding-top: 1.1vh; border-top: 1px solid var(--faint); }
  .hours div { text-align: center; font-size: 3.4vw; color: var(--muted); line-height: 1.35; }
  .hours b { display: block; font-size: 4.2vw; font-weight: 400; color: var(--fg); }
  .hours i { display: block; font-style: normal; font-size: 5vw; filter: saturate(.7) brightness(.85); }

  .dot { display: inline-block; width: 2.6vw; height: 2.6vw; border-radius: 50%; background: var(--ok); margin-right: 2vw; vertical-align: middle; }
  .dot.off { background: var(--crit); }
  .plex-line { font-size: 4.4vw; }
  .plex-head { display: flex; align-items: center; gap: 3vw; }      /* PLEX heading and status on one line */
  .plex-head h2 { margin-bottom: 0; }
  /* "● Running · version" in the same font, size and colour as the PLEX heading */
  .plex-head .plex-line { font-size: 3.2vw; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plex-head .dot { width: 1.8vw; height: 1.8vw; margin-right: 1.5vw; }
  /* fixed user lines: the card always has the same height, an empty line = nothing playing */
  .users { margin-top: .8vh; }
  .user { display: flex; align-items: baseline; gap: 2.5vw; font-size: 4.2vw; line-height: 1.4; white-space: nowrap; }
  .user .n { flex: none; min-width: 22vw; color: var(--plex); }
  .user .a { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
  .sess { margin-top: 1.1vh; }
  .sess .t { font-size: 4.4vw; line-height: 1.3; }
  .sess .t span { color: var(--plex); }
  .bar { height: .8vh; background: var(--faint); border-radius: 1vh; overflow: hidden; margin-top: 1vh; }
  .bar > div { height: 100%; background: var(--muted); border-radius: 1vh; }

  .disk { margin-bottom: 1.2vh; }
  .disk .top { display: flex; justify-content: space-between; font-size: 3.9vw; }
  .disk .top span:last-child { color: var(--muted); }
  .disk .top span.alarm { color: var(--crit); }
  .disk .bar > div.ok { background: var(--ok); }
  .disk .bar > div.warn { background: var(--warn); }
  .disk .bar > div.crit { background: var(--crit); }

  .sys { display: flex; flex-wrap: wrap; gap: .6vh 6vw; font-size: 3.8vw; color: var(--muted); }
  .sys b { color: var(--fg); font-weight: 400; }
  .foot { font-size: 3vw; color: #4d525a; }
  .foot.stale { color: var(--crit); }
  .foot:empty { display: none; }

  #hint {
    display: none; position: fixed; left: 0; right: 0; bottom: 3vh; text-align: center; font-size: 3.6vw; color: var(--muted);
  }


  /* radio */
  .radio-line { display: flex; align-items: center; justify-content: space-between; gap: 3vw; font-size: 4.2vw; }
  .radio-line .st.off { color: var(--muted); }
  .btn { display: inline-block; padding: 1vh 3.5vw; border: 1px solid #3a3f46; border-radius: 3vw; color: var(--fg); background: #0b0c0e; font-size: 3.8vw; white-space: nowrap; }
  #radioPanel { display: none; position: fixed; inset: 0; z-index: 10; background: #000; overflow-y: auto; padding: 4vh 6vw; }
  #radioPanel.open { display: block; }
  body.night #radioPanel { display: none; }
  .rp-head { display: flex; justify-content: space-between; align-items: center; }
  .rp-title { font-size: 6vw; }
  .rp-now { font-size: 4.4vw; margin: 1.6vh 0; min-height: 3em; }
  .rp-row { display: flex; flex-wrap: wrap; gap: 2vw; margin: 1.2vh 0; align-items: center; }
  .rp-group { font-size: 3.2vw; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 2.4vh 0 1vh; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; }
  .tile { border: 1px solid #2f343a; border-radius: 3vw; padding: 2vh 1.5vw; text-align: center; background: #0b0c0e; }
  .tile b { display: block; font-size: 3.9vw; font-weight: 500; color: var(--fg); }
  .tile span { font-size: 2.9vw; color: var(--muted); }
  .tile.on { border-color: var(--plex); }
  .tile.on b { color: var(--plex); }
  /* columns: transparent in portrait (sections one below another), two independent columns in landscape */
  .col { display: contents; }
  /* info block: equal columns, icon + value */
  .info .tr { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }      /* equal columns in each row separately */
  .info .c { padding: .9vh .5vw; border-top: 1px solid var(--faint); border-left: 1px solid var(--faint); white-space: nowrap; text-align: center; overflow: hidden; }
  .info .c:first-child { border-left: 0; }
  .info .k { display: block; font-size: 2.0vw; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: .3vh; }
  .info .v { font-size: 3.3vw; font-variant-numeric: tabular-nums; }
  .info .v b { font-weight: 400; color: var(--fg); }
  .info .v i { font-style: normal; color: var(--muted); }
  .info .v b.warn { color: var(--warn); }
  .info .v b.crit { color: var(--crit); }
  .tile .logo { height: 10vw; display: flex; align-items: center; justify-content: center; margin-bottom: 1vh;
    background: #e6e6e6; border-radius: 2vw; padding: .5vh 1.5vw; filter: brightness(.85); }
  .tile .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .mini { height: 1.5em; vertical-align: middle; margin-right: .5em; border-radius: .3em; background: #e6e6e6;
    padding: .1em .3em; filter: brightness(.75); }

  @media (orientation: landscape) {
    /* landscape: left column clock + weather, right column Plex + radio + info; sizes from screen height (vh) */
    #main {
      display: grid; grid-template-columns: 1.05fr 1fr; column-gap: 5vw;
      padding: 4vh max(3.5vw, env(safe-area-inset-right)) 3vh max(3.5vw, env(safe-area-inset-left));
    }
    .col { display: flex; flex-direction: column; gap: 3vh; min-height: 0; overflow: hidden; }
    .col-l { justify-content: space-between; }
    .col-r .s-info { margin-top: auto; }      /* the info table is the last block of the right column */
    #zodiac { display: block; position: absolute; left: 0; top: 0; width: 100px; height: 100px; pointer-events: none; }      /* zodiac sign left of the clock */
    .s-clock .clock, .s-clock .date { position: relative; left: 54px; }      /* clock and date ~1 cm to the right: room for the zodiac sign */
    .info .c { padding: .8vh .8vw; } .info .k { font-size: 2.0vh; } .info .v { font-size: 3.1vh; }
    .clock { font-size: 21vh; }
    .clock small { font-size: 7vh; }
    .date { font-size: 4.6vh; }
    h2 { font-size: 2.8vh; margin-bottom: 1vh; }
    .s-wx .city { font-size: calc(2.8vh + 2pt); margin-bottom: .3vh; }
    .wx-icon { font-size: 10vh; } .wx-temp { font-size: 11vh; }
    .wx-desc, .plex-line, .sess .t { font-size: 4vh; }
    .sub, .sys { font-size: 3.4vh; }
    .disk .top { font-size: 3.6vh; }
    .hours div { font-size: 3.1vh; } .hours b { font-size: 3.8vh; } .hours i { font-size: 4.4vh; }
    .dot { width: 2.4vh; height: 2.4vh; margin-right: 1.2vw; }
    .plex-head .plex-line { font-size: 2.8vh; }
    .plex-head .dot { width: 1.6vh; height: 1.6vh; margin-right: .8vw; }
    .user { font-size: 3.6vh; gap: 1.5vw; } .user .n { min-width: 9vw; }
    .foot { font-size: 2.8vh; }
    #hint { font-size: 3vh; }
    .radio-line { font-size: 3.8vh; }
    .btn { font-size: 3.4vh; padding: 1vh 1.6vw; border-radius: 2vh; }
    #radioPanel { padding: 4vh max(3.5vw, env(safe-area-inset-left)); }
    .rp-title { font-size: 5vh; } .rp-now { font-size: 3.8vh; } .rp-group { font-size: 2.8vh; }
    .tiles { grid-template-columns: repeat(6, 1fr); gap: 1.2vw; }
    .tile { border-radius: 2vh; padding: 1.6vh 1vw; } .tile .logo { height: 8vh; border-radius: 1.4vh; } .tile b { font-size: 3.4vh; } .tile span { font-size: 2.6vh; }
  }

  /* Radio card: status, buttons (play/stop, quieter, louder, sleep timer) and the 3 most played stations */
  .radio-head { display: flex; align-items: baseline; justify-content: space-between; }
  .radio-head h2 { margin-bottom: .6vh; }
  .radio-all { font-size: 3vw; color: var(--muted); }
  .radio-now { display: flex; align-items: center; justify-content: space-between; gap: 2vw; font-size: 4.2vw; white-space: nowrap; }
  .radio-now .st { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .radio-now .st.off { color: var(--muted); }
  .radio-vol { color: var(--muted); font-size: 3.4vw; font-variant-numeric: tabular-nums; }
  .radio-ctl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 1.2vh 0 8px; }
  .rbtn { display: flex; align-items: center; justify-content: center; gap: 3px; height: 46px; padding: 0; font-size: 13px; border-radius: 12px; }
  .rbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rbtn svg .f { fill: currentColor; stroke: none; }
  .rbtn i { font-style: normal; font-variant-numeric: tabular-nums; }
  /* 3 most played stations: tiles with logo (if any) and name */
  .radio-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .rtop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 52px; min-width: 0;
    border: 1px solid rgba(255, 255, 255, .16); border-radius: 12px; background: rgba(255, 255, 255, .04); }
  .rtop img { height: 24px; max-width: 90%; object-fit: contain; border-radius: 4px; background: #e6e6e6; padding: 1px 3px; filter: brightness(.8); }
  .rtop span { max-width: 92%; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rtop.on { border-color: var(--plex); }
  .rtop.on span { color: var(--plex); }
  @media (orientation: landscape) {
    .col-r .s-radio { width: 236px; align-self: flex-end; }      /* landscape: narrower card at the right edge */
    .radio-all { font-size: 2.4vh; }
    .radio-now { font-size: 3.4vh; gap: .8vw; } .radio-vol { font-size: 2.8vh; }
    .radio-ctl { gap: 6px; margin: 1vh 0 6px; }
    .rbtn { height: 44px; border-radius: 11px; }
    .radio-top { gap: 6px; }
    .rtop { height: 46px; border-radius: 11px; }
    .rtop img { height: 20px; }
    .rtop span { font-size: 10px; }
    #globe { left: calc(50% + 70px); }      /* Earth ~1.3 cm to the right, into the free space next to the Radio card */
  }

  /* ===== look: black background, smoked grey cards, copper weather card in a gold frame, copper icons ===== */
  :root { --fg: #f1f1f1; --muted: #a9a49d; --faint: rgba(255, 255, 255, .14); }
  .clock { font-weight: 500; color: #fff; }
  .clock small { font-weight: 400; color: #9b9b9b; }
  .date { color: #b5b5b5; }

  /* Plex, Radio and info cards: smoked glass with a thin light edge (no backdrop blur: it gave a dark band on black) */
  .s-plex, .s-radio, .s-info {
    background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .045));
    border: 1px solid rgba(255, 255, 255, .17);
    border-radius: 3vw; padding: 1.4vh 3.5vw;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10);
  }
  /* weather card: copper panel in a gold frame (light gold top left, old gold bottom right) */
  .s-wx {
    background: linear-gradient(160deg, rgba(150, 96, 56, .62) 0%, rgba(100, 64, 37, .62) 45%, rgba(48, 32, 19, .75) 100%);
    position: relative; border-radius: 3vw; padding: 1.4vh 3.5vw;
    box-shadow: 0 0 2.6vh rgba(212, 175, 55, .28), inset 0 1px 0 rgba(255, 222, 185, .28);
  }
  .s-wx > * { position: relative; z-index: 1; }
  .s-wx::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none; z-index: 2;
    background: linear-gradient(135deg, #fff1c1 0%, #e6c467 18%, #c9a032 42%, #8f6b1a 72%, #5e440e 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
  }
  .s-wx h2 { color: #efe0cf; }
  .s-wx .sub, .s-wx .hours div { color: #e6d7c7; }
  .s-wx .hours { border-top-color: rgba(255, 225, 190, .28); }

  /* copper pill button */
  .btn { background: linear-gradient(180deg, #8c5f37, #5b3c22); border: 1px solid rgba(232, 172, 112, .6); color: #fbeadb;
         box-shadow: 0 .4vh 1.2vh rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 222, 185, .35); }

  /* info table: icons instead of labels (the label stays in the markup with zero size) */
  .info .tr:first-child .c { border-top: 0; }
  .info .k { color: #bdb6ad; font-size: 0; letter-spacing: 0; }
  .info .v b { color: #fff; }
  .info .k::before { display: block; background: center / contain no-repeat; }
  /* top row: icon above the value */
  .info .c-ram .k::before, .info .c-load .k::before, .info .c-cpu .k::before, .info .c-bat .k::before {
    content: ''; width: 3.2vh; height: 3.2vh; margin: 0 auto .4vh;
  }
  /* bottom row (drives): icon on the left, data on the same line */
  .info .tr:nth-child(2) .c { display: flex; align-items: center; justify-content: center; gap: 1.6vw; }
  .info .tr:nth-child(2) .k { margin: 0; }
  .info .c-phone .k::before, .info .c-hdd .k::before, .info .c-usb .k::before { content: ''; width: 2.8vh; height: 2.8vh; margin: 0; }
  .info .c-ram .k::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d0945f' stroke-width='1.6' stroke-linejoin='round'><rect x='2' y='7' width='20' height='9' rx='1'/><rect x='5.5' y='9.5' width='3' height='4'/><rect x='10.5' y='9.5' width='3' height='4'/><rect x='15.5' y='9.5' width='3' height='4'/><path d='M5 16v2.5M9 16v2.5M15 16v2.5M19 16v2.5'/></svg>"); }
  .info .c-load .k::before, .info .c-cpu .k::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d0945f' stroke-width='1.6' stroke-linejoin='round'><rect x='6' y='6' width='12' height='12' rx='1.5'/><rect x='9.5' y='9.5' width='5' height='5'/><path d='M9.5 2.5v3.5M14.5 2.5v3.5M9.5 18v3.5M14.5 18v3.5M2.5 9.5h3.5M2.5 14.5h3.5M18 9.5h3.5M18 14.5h3.5'/></svg>"); }
  .info .c-bat.chg .k::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d0945f' stroke-width='1.6' stroke-linejoin='round'><rect x='2' y='7' width='18' height='10' rx='2'/><path d='M22 10.5v3'/><path d='M12.2 8.2l-3.4 4.3h3l-1 3.3 3.6-4.6h-3.1z' fill='%23d0945f' stroke='none'/></svg>") !important; }
  .info .c-bat .k::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d0945f' stroke-width='1.6' stroke-linejoin='round'><rect x='2' y='7' width='18' height='10' rx='2'/><path d='M22 10.5v3'/><rect x='4.5' y='9.5' width='13' height='5' rx='.5' fill='%23d0945f' stroke='none'/></svg>"); }
  .info .c-phone .k::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d0945f' stroke-width='1.6' stroke-linejoin='round' stroke-linecap='round'><rect x='6.5' y='2.5' width='11' height='19' rx='2.2'/><path d='M10.5 18.5h3'/></svg>"); }
  .info .c-hdd .k::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d0945f' stroke-width='1.6' stroke-linejoin='round' stroke-linecap='round'><rect x='3.5' y='2.5' width='17' height='19' rx='2.2'/><circle cx='12' cy='10.5' r='4.8'/><circle cx='12' cy='10.5' r='1.1' fill='%23d0945f' stroke='none'/><path d='M7 18.5h3.5'/></svg>"); }
  .info .c-usb .k::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d0945f' stroke-width='1.6' stroke-linejoin='round' stroke-linecap='round'><rect x='7' y='9' width='10' height='12.5' rx='1.6'/><path d='M9 9V3.5h6V9'/><path d='M11 5.8h.01M13 5.8h.01'/></svg>"); }

  @media (orientation: landscape) {
    .s-wx, .s-plex, .s-radio, .s-info { border-radius: 2vh; padding: 1.4vh 1.6vw; }
    .info .c-ram .k::before, .info .c-load .k::before, .info .c-cpu .k::before, .info .c-bat .k::before { width: 5.4vh; height: 5.4vh; }
    .info .tr:nth-child(2) .c { gap: .8vw; }
    .info .c-phone .k::before, .info .c-hdd .k::before, .info .c-usb .k::before { width: 4.4vh; height: 4.4vh; }
  }

  /* drives as rings: arc = free space, percentage of free space inside, free GB and a short name next to it */
  .info .tr.dk-row .c { padding: .6vh .4vw; }
  .info .dk .tx { display: flex; flex-direction: column; align-items: flex-start; gap: .1vh; }
  .info .dk .ln { display: flex; align-items: center; gap: .7vw; }
  .info .dk .nm { padding-left: .2vw; font-size: 1.7vh; letter-spacing: .14em; text-transform: uppercase; color: #bdb6ad; }
  .info .dk .ring { position: relative; width: 6.8vh; height: 6.8vh; flex: none; }
  .info .dk .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .info .dk .ring .tk { stroke: rgba(255, 255, 255, .12); }

<script>

}
let heroId;
function renderHero(r) {
  const id = (r && r.id) || store.get('radioLast', null) || (topStations()[0] || {}).id;
  const st = findStation(id);
  if (id !== heroId && st) {
    heroId = id;
    $('rpLogo').innerHTML = st.logo ? `<img src="${esc(st.logo)}" alt="">` : '📻';
    $('rpName').textContent = st.name;
    if (st.logo) logoGlow(st.logo, c => $('radioPanel').style.setProperty('--glow', c));
  }
  $('radioPanel').classList.toggle('playing', !!(r && r.state === 'playing'));
  $('rpNow').innerHTML = !r ? RT.na : r.state === 'playing' ? esc(outName(r.output)) + sleepText(r)
    : r.state === 'connecting' ? RT.connecting : r.state === 'error' ? '⚠ ' + esc(r.info) : RT.off;
}
function bumpPanel() { clearTimeout(panelTimer); panelTimer = setTimeout(closePanel, 30000); }
function openPanel() { $('radioPanel').classList.add('open'); rpTab = null; renderStations(); loadStations(); radioCall('/radio/state'); bumpPanel(); }
function closePanel() { $('radioPanel').classList.remove('open'); clearTimeout(panelTimer); }
// Radio card: buttons and top 3 work directly; a tap anywhere else opens the full station list
$('radioSec').addEventListener('click', e => {
  const top = e.target.closest('.rtop'), act = e.target.closest('[data-act]');
  if (top) { radioCall('/radio/play?id=' + encodeURIComponent(top.dataset.id)); return; }
  if (!act) { openPanel(); return; }
  const a = act.dataset.act, vol = radio ? radio.volume : 50;
  if (a === 'toggle') {
    if (radioOn(radio)) radioCall('/radio/stop');
    else { const id = store.get('radioLast', null) || (topStations()[0] || {}).id; if (id) radioCall('/radio/play?id=' + encodeURIComponent(id)); }
  } else if (a === 'down') radioCall('/radio/volume?v=' + Math.max(0, vol - 10));
  else if (a === 'up') radioCall('/radio/volume?v=' + Math.min(100, vol + 10));
  else if (a === 'sleep') {        // repeated taps: 15 -> 30 -> 60 -> 90 min -> no sleep timer
    const rem = radio && radio.sleepUntil ? (radio.sleepUntil - Date.now()) / 60000 : 0;
    radioCall('/radio/sleep?min=' + ([15, 30, 60, 90].find(m => m > rem + 1) || 0));
  }
});
$('rpClose').addEventListener('click', e => { e.stopPropagation(); closePanel(); });
$('radioPanel').addEventListener('click', e => {
  bumpPanel();
  const tab = e.target.closest('[data-tab]');
  if (tab) { jumpTo(+tab.dataset.tab, true); return; }
  const tile = e.target.closest('.tile');
  if (tile) { radioCall('/radio/play?id=' + encodeURIComponent(tile.dataset.id)); return; }
  const sl = e.target.closest('[data-min]');
  if (sl) { radioCall('/radio/sleep?min=' + sl.dataset.min); return; }
  if (e.target.closest('#rpStop')) {
    if (radioOn(radio)) radioCall('/radio/stop');
    else { const id = store.get('radioLast', null) || (topStations()[0] || {}).id; if (id) radioCall('/radio/play?id=' + encodeURIComponent(id)); }
  }
  else if (e.target.closest('#rpVolUp')) radioCall('/radio/volume?v=' + Math.min(100, (radio ? radio.volume : 50) + 10));
  else if (e.target.closest('#rpVolDown')) radioCall('/radio/volume?v=' + Math.max(0, (radio ? radio.volume : 50) - 10));
});
let radioTick = 0;
setInterval(() => { radioTick++; if ($('radioPanel').classList.contains('open') || radioTick % 3 === 0) radioCall('/radio/state'); }, 5000);
radioCall('/radio/state'); loadStations();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
